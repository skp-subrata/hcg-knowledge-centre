{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto py-10">
    <div class="glass-panel p-8">
        <h1 class="text-3xl font-bold mb-6">Edit Profile</h1>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            
            <div class="flex items-center gap-6 mb-6">
                <div class="w-24 h-24 rounded-full bg-slate-200 dark:bg-slate-800 border-2 border-slate-300 dark:border-slate-700 overflow-hidden flex items-center justify-center bg-cover bg-center" {% if user_data.profile_picture %}style="background-image: url('/uploads/{{ user_data.profile_picture }}')"{% endif %}>
                    {% if not user_data.profile_picture %}
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    {% endif %}
                </div>
                <div>
                    <label class="form-label block mb-2">Profile Picture</label>
                    <input type="file" name="profile_picture" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 dark:file:bg-slate-800 dark:file:text-slate-300">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="form-label">Display Name (Full Name) *</label>
                    <input type="text" name="full_name" class="form-input" value="{{ user_data.full_name }}" required>
                </div>
                <div>
                    <label class="form-label">Employee ID *</label>
                    <input type="text" name="employee_id" class="form-input" value="{{ user_data.employee_id or '' }}" required>
                </div>
                <div>
                    <label class="form-label">Email *</label>
                    <input type="email" name="email" class="form-input" value="{{ user_data.email or '' }}" required>
                </div>
                <div>
                    <label class="form-label">Phone Number *</label>
                    <input type="tel" name="phone_number" class="form-input" value="{{ user_data.phone_number or '' }}" required>
                </div>
                <div>
                    <label class="form-label">Department</label>
                    <select name="department_id" class="form-input dept-select">
                        <option value="">[ Select Department ▼ ]</option>
                        {% for d in master_depts %}
                        <option value="{{ d.id }}" {% if user_data.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="form-label">Position</label>
                    <select name="position_id" class="form-input pos-select">
                        <option value="">[ Select Position ▼ ]</option>
                        {% for p in master_positions %}
                        <option value="{{ p.id }}" {% if user_data.position_id == p.id %}selected{% endif %}>{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="form-label">Interests</label>
                    <select name="interests" multiple class="form-input h-24 int-select">
                        {% set user_ints = (user_data.interest_ids or '').split(',') %}
                        {% for i in master_interests %}
                        <option value="{{ i.id }}" {% if i.id|string in user_ints %}selected{% endif %}>{{ i.name }}</option>
                        {% endfor %}
                    </select>
                    <p class="text-[10px] text-slate-400 mt-1">Hold Ctrl (or Cmd) to select multiple interests.</p>
                </div>
                <div class="md:col-span-2">
                    <label class="form-label">About Me</label>
                    <textarea name="about_me" class="form-input h-24" placeholder="Short professional or personal introduction">{{ user_data.about_me or '' }}</textarea>
                </div>
            </div>
            
            <div class="pt-4 flex gap-4">
                <button type="submit" class="btn-primary flex-1">Save Changes</button>
                <a href="{{ url_for('home') }}" class="btn-secondary flex-1 text-center">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
